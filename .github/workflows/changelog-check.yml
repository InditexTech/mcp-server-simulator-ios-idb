name: Changelog check

# Previews the CHANGELOG.md entries a pull request will get at release time
# and warns when it is not linked to the issue it closes. The entries are
# generated by .github/scripts/changelog-from-prs.mjs (see CONTRIBUTING.md).

on:
  pull_request:
    # `edited` because the issue link lives in the PR body; `labeled` and
    # `unlabeled` because `skip-changelog` leaves the PR out.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled, edited]
    branches: [main]

concurrency:
  group: changelog-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  NODE_VERSION: '24.22.1'
  # 'true' fails a PR that has no linked issue and no bypass. Warn-only for now.
  CHANGELOG_LINK_ENFORCE: 'false'

jobs:
  linked-issue:
    name: Changelog / Linked issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the changelog scripts
        run: node --test '.github/scripts/*.test.mjs'

      # Fork PRs get a read-only token, so the result goes to the job summary
      # rather than a PR comment.
      - name: Preview the changelog entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # --dry-run reads CHANGELOG.md to report entries already released and
          # never writes it.
          ARGS=(--pr "$PR_NUMBER" --changelog CHANGELOG.md --dry-run --report "$GITHUB_STEP_SUMMARY")
          if [[ "$CHANGELOG_LINK_ENFORCE" == 'true' ]]; then
            ARGS+=(--enforce)
          fi
          node .github/scripts/changelog-from-prs.mjs "${ARGS[@]}"
