name: Integration

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'jest.integration.config.js'
      - 'scripts/install_dependencies.sh'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PYTHON_VERSION: '3.11'

jobs:
  simulator:
    name: Simulator integration
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create and activate Python virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "PATH=$VIRTUAL_ENV/bin:$PATH" >> $GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # npm ci runs scripts/install_dependencies.sh, which installs idb-companion and fb-idb
      - name: Install dependencies
        run: |
          source venv/bin/activate
          npm ci

      - name: Run integration tests
        env:
          IOS_SIM_INTEGRATION: '1'
          IOS_SIM_ARTIFACTS_DIR: ${{ runner.temp }}/integration-artifacts
        run: |
          source venv/bin/activate
          npm run test:integration

      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-artifacts
          path: |
            logs/
            ${{ runner.temp }}/integration-artifacts/
          if-no-files-found: ignore
          retention-days: 7
